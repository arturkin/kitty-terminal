[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
    "dist",
    "build",
    ".next",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
    "*.map",
]

[retriever]
mode = "sqlite"
max_entry_bytes = 10485760
max_entries = 200
retention_days = 30
compression = true
tee_max_files = 20
tee_max_file_size = 1048576
tee_on_success = false

[telemetry]
enabled = false

[hooks]
# Commands where losing detail causes a wrong decision -- not "secret-bearing"
# commands. rtk is local and never transmits output, and its aws filters
# actively strip secrets, so `aws` and plain `kubectl` stay on.
exclude_commands = [
    "doppler",
    "op",
    "vault",
    "env",
    "printenv",
    "git rebase",
    "git cherry-pick",
    "git bisect",
    # rtk's hook returns permissionDecision "allow" for commands it rewrites.
    # `git checkout .` discards uncommitted work; don't let a third-party
    # heuristic be the thing that approves it.
    "git checkout",
    "helm",
    "kubectl exec",
    "docker exec",
    "psql",
    "mysql",
]
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000

[awareness]
# "high" tells the agent about RTK_DISABLED=1 and `rtk recall`, so it can fetch
# full output when a filter trimmed something it needed. That escape hatch is
# the guard against rtk's one real risk: silent truncation.
level = "high"
