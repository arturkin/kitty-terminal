# kitty configuration. Set up 2026-08-31.
#
# kitty stores only fractional biases for a layout and recomputes geometry from
# the real window size on every layout pass, so a pane layout here cannot end up
# inconsistent: 12/12 clean when closing a pane 0ms after opening one, 6/6 even
# across a 7x resize range, and `layout_action equalize` repairs any skew in a
# single action. See development.md 2 for the measurements and why that matters.

# ---------------------------------------------------------------------------
# Remote control -- required by workmux's kitty backend
# ---------------------------------------------------------------------------
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# `splits` is what workmux needs for its own pane creation; `grid` is what the
# startup 2x2 uses, because grid derives every cell from the window size with no
# tree at all -- it re-flows correctly when you add or remove a pane. `stack` is
# the zoom target for ALT+Z.
enabled_layouts splits:equalize_on_window_close=y,grid,stack
startup_session ~/.config/kitty/session.conf

# ---------------------------------------------------------------------------
# Font. kitty rasterises with CoreText on macOS -- the same engine Terminal.app
# uses -- so there is nothing to tune here. The whole freetype saga (NO_BITMAP
# for Monaco's embedded bitmap strikes, subpixel vs greyscale, stem darkening
# that turned out to be inert on TrueType) does not apply. wt-font is deleted.
# ---------------------------------------------------------------------------
font_family Monaco
font_size 13.0

# ---------------------------------------------------------------------------
# Appearance. Terminal.app "Pro" ground: white on pure black.
# ---------------------------------------------------------------------------
background #000000
foreground #ffffff
cursor #ffffff
background_opacity 0.92

# kitty pads each pane rather than the window, so text stops touching dividers.
window_padding_width 4 8

# 1px at #313244. kitty's default inactive_border_color is #cccccc -- bright
# white on black, which reads as a thick slab.
window_border_width 1px
draw_minimal_borders yes
inactive_border_color #313244
active_border_color #45475a

# Dims inactive panes' text, and only its brightness. Cutting saturation too
# washes out 75% of the screen, because 3 of 4 panes in a 2x2 are inactive.
# Never desaturate; dim just enough to mark focus. See development.md 5.
inactive_text_alpha 0.88

# Native titlebar KEPT: it carries the three buttons and it is the only thing
# you can drag the window by. kitty has no drag-by-body and no integrated
# window buttons, so the choice is a titlebar row or no drag.
# Colouring it to the background is what fixes the light-slab look.
hide_window_decorations no
macos_titlebar_color background
macos_show_window_title_in window

# ---------------------------------------------------------------------------
# Palette: Catppuccin Mocha, lightness pulled toward 0.50 ("VIVID 0.6").
# Mocha ships at HSL lightness 0.73-0.86 and a hue carries maximum chroma at
# 0.50, so as shipped every colour is most of the way to white. Its `brights`
# are also byte-identical to its `ansi`; these are separated so bold reads as
# the brighter of the two.
# ---------------------------------------------------------------------------
color0  #45475a
color1  #f23f71
color2  #5de152
color3  #f6c14b
color4  #3a83f9
color5  #ee59c5
color6  #4be2c9
color7  #bac2de
color8  #585b70
color9  #f4618a
color10 #7ae672
color11 #f8cd6f
color12 #5d99fa
color13 #f17bd1
color14 #6be7d3
color15 #a6adc8

# ---------------------------------------------------------------------------
# Tab bar as the agent list. {custom} calls draw_title in tab_bar.py, which
# surfaces the workmux_status user variable, and appends ▸N when N panes in that
# tab are running something that is not an agent (F2 lists every command in
# every pane, agents and what is running under them included).
# ---------------------------------------------------------------------------
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_style powerline
tab_title_template "{title}{custom}"
tab_bar_align left
watcher workmux_watcher.py

# Rolling session snapshots. Snapshots the workspace shape (tabs, panes, their
# working directories, which panes run an agent) on focus change, so
# `kitty-session restore` can rebuild it after a quit. kitty still kills every
# process when it exits -- this restores the shape, and resumes agents with
# `claude --continue`.
watcher session_watcher.py

# ---------------------------------------------------------------------------
# Agent ergonomics
# ---------------------------------------------------------------------------
scrollback_lines 200000
enable_audio_bell no

# Desktop notification when a command that ran longer than 10s finishes in a
# pane you are not looking at. Claude Code agents get their own, richer
# notifications from ~/.claude/hooks/kitty-notify.py; this covers everything
# else -- builds, test runs, installs.
notify_on_cmd_finish unfocused 10.0
update_check_interval 0
confirm_os_window_close 2

# macOS: left Option must send ESC so the alt bindings fire; right Option stays
# composed for accented characters.
macos_option_as_alt left

# ---------------------------------------------------------------------------
# Keys
# ---------------------------------------------------------------------------
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map alt+z toggle_layout stack

# No cooldown guard needed: closing a pane immediately after opening one is
# safe here -- 12/12 clean at a 0ms gap.
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+t       new_tab_with_cwd
map cmd+w       close_window
map cmd+n       new_os_window_with_cwd

# One action, never fails, tears nothing down. equalize_on_window_close keeps
# the grid even without pressing it.
map alt+equal layout_action equalize

# Clear screen AND scrollback, then make the shell redraw. Terminal.app's CMD+K
# behaviour; kitty's default leaves the viewport alone.
map cmd+k combine : clear_terminal reset active : send_text normal,application \x0c

map cmd+equal change_font_size all +1.0
map cmd+plus  change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0
map cmd+ctrl+f toggle_fullscreen
map cmd+shift+r load_config_file

# IDE button. wt-ide has zero terminal-specific code, so it ported unchanged;
# --cwd=current supplies the active pane's directory via shell integration.
map alt+o launch --type=background --cwd=current sh -c '$HOME/.local/bin/wt-ide --auto "$PWD"'
map alt+i launch --type=background --cwd=current sh -c '$HOME/.local/bin/wt-ide --other "$PWD"'

# Whole change set in its own OS window: file tree on the left, syntax
# highlighted diff on the right (diffnav). kdiff -h for the arguments.
map cmd+shift+g launch --type=os-window --cwd=current sh -c '$HOME/.local/bin/kdiff'

# diffnav quits on `q` and has no ESC binding, nor any config file to add one.
# Rather than kill the window (which would take the shell with it when kdiff
# runs in a pane), ESC is rewritten to the key the tool already understands, so
# it exits on its own. Scoped by title: kdiff sets "diff: <repo>" before it
# hands off, so this never reaches an ordinary pane. lazygit needs none of
# this -- quitOnTopLevelReturn in its own config does the same job natively.
map --when-focus-on title:^diff: esc send_text all q

# Session snapshots. Save is also automatic (session_watcher.py); restore
# rebuilds the last snapshot as new tabs and resumes each agent.
map cmd+alt+s launch --type=background sh -c '$HOME/.local/bin/kitty-session save'
map cmd+alt+r launch --type=background sh -c '$HOME/.local/bin/kitty-session restore'

# What is running in every pane, as an overlay: kill it, or jump to its pane.
# The tab bar's ▸N marks panes busy in the foreground; this lists everything,
# including what you backgrounded with `&`. kjobs -h for the rest.
#
# The first line unmaps F2 while the list itself is focused, so the key reaches
# kjobs, which closes on it. Without it kitty would handle the second press too
# and stack another overlay on the first. Same trick for the cheat sheet below,
# which already closes on any key.
map --when-focus-on title:^Running$ f2
map f2 launch --type=overlay --cwd=current --title Running sh -c '$HOME/.local/bin/kjobs'

# `launch` hands its child PATH=/Applications/kitty.app/Contents/MacOS plus the
# system directories and nothing else -- no Homebrew. kitty resolves `lazygit`
# itself, but lazygit then cannot find `delta`, and the diff pane renders
# "delta: command not found". Hence the PATH prefix on both lazygit maps; kdiff
# and kpull carry the same fixup inside the scripts.
# Git over the current pane, rooted where that pane is: stage hunks, branch,
# fetch, pull, push, rebase, stash, reflog. `q` closes it. F3 is unmapped while
# it has focus so a second press reaches lazygit instead of stacking a second
# overlay -- lazygit ignores F3, so it is a no-op rather than a kill, which
# matters mid-rebase.
map --when-focus-on title:^Git$ f3
map f3 launch --type=overlay --cwd=current --title Git sh -c 'PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; exec lazygit'

# WebStorm's Update Project, on WebStorm's neighbouring key: fetch every
# remote, prune branches that are gone, merge the upstream branch. A dirty
# tree is fine -- kpull autostashes around the merge, and git restores that
# whether you finish the merge or abort it. CMD+T stays new-tab.
map --when-focus-on title:^Update$ cmd+shift+t
map cmd+shift+t launch --type=overlay --cwd=current --title Update sh -c '$HOME/.local/bin/kpull'

# Commit and push. Same lazygit, opened with the file list enlarged against
# the diff instead of the four-panel dashboard, which is the commit dialog:
# `space` stages, `c` commits, `P` pushes, `q` closes.
map --when-focus-on title:^Commit$ cmd+shift+k
map cmd+shift+k launch --type=overlay --cwd=current --title Commit sh -c 'PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"; exec lazygit --screen-mode half'

# --cwd=current on an overlay is not about the overlay: it is about what runs
# NEXT. `launch --cwd=current` resolves against the FOCUSED window, so an
# overlay opened without it sits at kitty's own cwd ($HOME), and any pane-
# relative key pressed while it has focus -- ALT+O, F3, CMD+SHIFT+T -- resolves
# against $HOME instead of the pane underneath. wt-ide then finds no repo there
# and opens the home folder.
# Cheat sheet, as an overlay over the current pane rather than a whole new tab.
# wt-help already waits for a keypress, so any key dismisses it.
map --when-focus-on title:^Shortcuts$ f1
map --when-focus-on title:^Shortcuts$ alt+slash
map f1        launch --type=overlay --cwd=current --title Shortcuts sh -c '$HOME/.local/bin/wt-help'
map alt+slash launch --type=overlay --cwd=current --title Shortcuts sh -c '$HOME/.local/bin/wt-help'

# ---------------------------------------------------------------------------
# Extension point: drop any .conf into ~/.config/kitty/local.d/ to override
# anything above. globinclude (not include) tolerates the directory not
# existing.
# ---------------------------------------------------------------------------
globinclude local.d/*.conf
