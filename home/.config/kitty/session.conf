# Startup layout: the 2x2, in the `grid` layout.
#
# grid derives every cell from the window size with no split tree, so there is
# no build order to get wrong, no settle loop to wait on and nothing that can
# end up inconsistent -- it also re-flows correctly when a 5th pane appears.
# This replaces wt-grid's poll-until-stable, verify-and-retry machinery.
new_tab main
layout grid
cd ~
launch zsh
launch zsh
launch zsh
launch zsh
