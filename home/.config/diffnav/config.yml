# diffnav, the viewer behind kdiff and CMD+SHIFT+G.
#
# Only the banner is reclaimable here. The breadcrumb, the search prompt and
# the box around each file header are not options, and that box is handed to
# delta on the command line, where config cannot reach it. Everything about
# the diff body -- tab width, the box around hunk headers -- belongs to delta
# and lives in the [delta] section of the global git config instead.
#
# Unified rather than side-by-side: side-by-side splits the width in two and
# spends a blank row opposite every insertion, which on a monorepo diff of
# deeply indented C# and long JSON lines leaves very little of either line
# visible. `s` toggles back for the times a rewrite needs reading in parallel.
ui:
  hideHeader: true
  sideBySide: false
